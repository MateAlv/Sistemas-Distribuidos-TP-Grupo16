compose:
  output_file: docker-compose.yaml
  test_output_file: docker-compose.test.yaml
  rabbitmq_ports: false
settings:
  logging_level: INFO
  server_port: 5678
  chunk_max_bytes: 65536
  filter_output_batch_bytes: 65536
  result_line_max_bytes: 1048576
  connect_timeout_seconds: 30
  io_timeout_seconds: 3600
queries:
  - q5
workers:
  file_ingestors: 1
  filters:
    usd: 1
    q1: 1
    date: 1
    q5_format: 1
    q5_usd: 2
  sums:
    q2: 1
    q3: 1
  aggregators:
    q2: 1
    q3: 1
    q5: 1
  joiners:
    q2: 1
    q3: 1
    q5: 1
  q3_barrier: 1
  scatter_gather:
    mappers: 1
    linkers: 1
    detectors: 1
    min_intermediaries: 5
  q4:
    filters: 1
    sums: 1
    joiners: 1
    aggregators: 1
    dedupers: 1
clients: 1
client_accounts:
  - client_id: 0
    accounts_file: data/datasets/LI-Small/LI-Small_accounts.csv
    transactions_file: data/datasets/LI-Small/LI-Small_Trans.csv
