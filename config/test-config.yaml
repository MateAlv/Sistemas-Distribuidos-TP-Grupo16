compose:
  output_file: docker-compose.yaml
  test_output_file: docker-compose.test.yaml
  rabbitmq_ports: true
  rabbitmq_durable: false
  rabbitmq_publisher_confirms: false

settings:
  logging_level: INFO
  server_port: 5678
  chunk_max_bytes: 65536
  result_line_max_bytes: 1048576
  connect_timeout_seconds: 30
  io_timeout_seconds: 3600
  filter_prefetch_count: 50
  snapshot_interval: 2000
  monkey:
    enabled: true
    max_kills: 0
    interval_min: 30
    interval_max: 30
    client_disconnect_abort: false
    client_disconnect_delay: 5
    kill_monitor_leader_first: false
    targets:
      file_ingestor: false
      file_splitter: false
      q4_filter: false
      q4_joiner: false
      q4_sum: false
      q4_aggregator: false
      q4_deduper: false
      filter_usd: false
      filter_q1: false
      filter_date: false
      filter_q5_format: false
      filter_q5_usd: false
      sum_q2: false
      sum_q3: false
      aggregation_q2: false
      aggregation_q3: false
      aggregation_q5: false
      join_q2: false
      join_q3: false
      join_q5: false
      q2_bank_name_joiner: false
      q3_barrier: true

monitor:
  enabled: true
  count: 3
  port: 9000
  election_port: 9001
  check_interval: 3
  max_missed: 3
  election_timeout: 5
  coordinator_timeout: 10

workers:
  file_splitters: 3
  file_ingestors: 6
  filters:
    usd: 6
    q1: 3
    date: 4
    q5_format: 3
    q5_usd: 3
  sums:
    q2: 4
    q3: 6
  aggregators:
    q2: 3
    q3: 3
    q5: 2
  joiners:
    q2: 1
    q3: 1
    q5: 1
  q3_barrier: 2
  q4:
    filters: 6
    sums: 4
    joiners: 8
    aggregators: 8
    dedupers: 2

clients: 2
client_accounts:
  - client_id: 0
    accounts_file: data/datasets/HI-Medium/HI-Medium_accounts.csv
    transactions_file: data/datasets/HI-Medium/HI-Medium_Trans.csv
  - client_id: 1
    accounts_file: data/datasets/HI-Medium/HI-Medium_accounts.csv
    transactions_file: data/datasets/HI-Medium/HI-Medium_Trans.csv
