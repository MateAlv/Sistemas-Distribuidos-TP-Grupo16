services:
  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 20s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_INGESTOR_EXCHANGE=file_ingestor_exchange
    - FILE_INGESTOR_PARTITIONS=1
    - FILE_SPLITTER_QUEUE_PREFIX=file_splitter
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - GATEWAY_Q1_ENABLED=0
    - GATEWAY_Q2_QUEUE=join_q2_results_queue
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
  file_splitter_0:
    build:
      context: ./src/
      dockerfile: workers/file_splitter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_SPLITTER_INPUT_EXCHANGE=file_ingestor_exchange
    - FILE_SPLITTER_QUEUE_PREFIX=file_splitter
    - FILE_INGESTOR_AMOUNT=1
    - ID=0
    - LINE_BATCH_OUTPUT_EXCHANGE=line_batch_exchange
    - LINE_BATCH_OUTPUT_ROUTING_PREFIX=file_ingestor
    - LOGGING_LEVEL=INFO
    - MAX_BATCH_BYTES=1048576
    - MAX_LINE_BYTES=16777216
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - ACCOUNTS_LINE_BATCH_OUTPUT_QUEUE=accounts_line_batch_queue
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - NODE_NAME=file_splitter_0
    volumes:
    - file_splitter_0_state:/worker_state
    container_name: file_splitter_0
  file_ingestor_0:
    build:
      context: ./src/
      dockerfile: workers/file_ingestor/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - FILE_INGESTOR_AMOUNT=1
    - FILE_INGESTOR_CONTROL_QUEUE_PREFIX=file_ingestor_control
    - FILE_INGESTOR_RESPONSE_QUEUE_PREFIX=file_ingestor_response
    - LINE_BATCH_INPUT_QUEUE=file_ingestor_0
    - LINE_BATCH_INPUT_EXCHANGE=line_batch_exchange
    - LINE_BATCH_INPUT_ROUTING_PREFIX=file_ingestor
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/worker_state
    - FILTER_USD_AMOUNT=1
    - FILTER_USD_EXCHANGE=filter_usd_exchange
    - FILTER_USD_ROUTING_PREFIX=filter_usd
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
    - SNAPSHOT_INTERVAL=1000
    - NODE_NAME=file_ingestor_0
    volumes:
    - file_ingestor_0_state:/worker_state
    container_name: file_ingestor_0
  filter_usd_0:
    build:
      context: ./src/
      dockerfile: workers/filter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - CONFIGURATION=USD
    - FILTER_AMOUNT=1
    - FILTER_DATE_QUEUE=filter_date_queue
    - FILTER_PREFIX=filter
    - FILTER_Q1_QUEUE=filter_q1_queue
    - FILTER_Q3_QUEUE=filter_q3_queue
    - FILTER_Q5_USD_QUEUE=filter_q5_usd_queue
    - GATEWAY_QUEUE=gateway_results_queue
    - ID=0
    - INPUT_QUEUE=filter_usd_0
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - Q3_BARRIER_AMOUNT=1
    - Q3_CANDIDATES_QUEUE=q3_candidates_queue
    - SCATTER_GATHER_MAPPER_QUEUE=scatter_gather_mapper_queue
    - SUM_PREFIX=sum_q3
    - SUM_Q3_QUEUE=sum_q3_queue
    - USD_ENABLE_Q1=0
    - USD_ENABLE_Q2=1
    - USD_ENABLE_DATE=0
    - DATE_ENABLE_Q3=0
    - DATE_ENABLE_Q4=0
    - SUM_Q2_AMOUNT=1
    - SUM_Q2_EXCHANGE=sum_q2_exchange
    - SUM_Q2_ROUTING_PREFIX=sum_q2
    - INPUT_EXCHANGE=filter_usd_exchange
    - INPUT_ROUTING_PREFIX=filter_usd
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - NODE_NAME=filter_usd_0
    volumes:
    - filter_usd_0_state:/worker_state
    container_name: filter_usd_0
  sum_q2_0:
    build:
      context: ./src/
      dockerfile: workers/sum/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation_q2
    - CONFIGURATION=Q2
    - ID=0
    - INPUT_QUEUE=sum_q2_0
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=1
    - SUM_PREFIX=sum_q2
    - INPUT_EXCHANGE=sum_q2_exchange
    - INPUT_ROUTING_PREFIX=sum_q2
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - NODE_NAME=sum_q2_0
    volumes:
    - sum_q2_0_state:/worker_state
    container_name: sum_q2_0
  aggregation_q2_0:
    build:
      context: ./src/
      dockerfile: workers/aggregator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation_q2
    - CONFIGURATION=Q2
    - ID=0
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=join_q2_queue
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=1
    - SUM_PREFIX=sum_q2
    - STATE_DIR=/worker_state
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
    - SNAPSHOT_INTERVAL=1000
    - NODE_NAME=aggregation_q2_0
    volumes:
    - aggregation_q2_0_state:/worker_state
    container_name: aggregation_q2_0
  join_q2:
    build:
      context: ./src/
      dockerfile: workers/joiner/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation_q2
    - CONFIGURATION=Q2
    - ID=0
    - INPUT_QUEUE=join_q2_queue
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=q2_enrich_queue
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=1
    - SUM_PREFIX=sum_q2
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - NODE_NAME=join_q2
    volumes:
    - join_q2_state:/worker_state
    container_name: join_q2
  q2_bank_name_joiner:
    build:
      context: ./src/
      dockerfile: workers/q2_bank_name_joiner/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ACCOUNTS_INPUT_QUEUE=accounts_line_batch_queue
    - ID=0
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=join_q2_results_queue
    - PYTHONUNBUFFERED=1
    - Q2_INPUT_QUEUE=q2_enrich_queue
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - NODE_NAME=q2_bank_name_joiner
    volumes:
    - q2_bank_name_joiner_state:/worker_state
    container_name: q2_bank_name_joiner
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    depends_on:
    - gateway
    - file_splitter_0
    - file_ingestor_0
    - filter_usd_0
    - sum_q2_0
    - aggregation_q2_0
    - join_q2
    - q2_bank_name_joiner
    environment:
    - ACCOUNTS_FILE=LI-Small_accounts.csv
    - TRANSACTIONS_FILE=LI-Small_Trans.csv
    - CHUNK_MAX_BYTES=1048576
    - CLIENT_ID=0
    - CONNECT_TIMEOUT_SECONDS=30
    - DATA_DIR=/data/input
    - OUTPUT_DIR=/data/output
    - IO_TIMEOUT_SECONDS=3600
    - LOGGING_LEVEL=INFO
    - PYTHONUNBUFFERED=1
    - RESULT_LINE_MAX_BYTES=1048576
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    volumes:
    - ./data/datasets/LI-Small:/data/input:ro
    - ./data/output:/data/output:rw
volumes:
  file_ingestor_0_state: null
  aggregation_q2_0_state: null
  file_splitter_0_state: null
  filter_usd_0_state: null
  sum_q2_0_state: null
  join_q2_state: null
  q2_bank_name_joiner_state: null
