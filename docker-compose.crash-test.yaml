services:
  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 20s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_INGESTOR_EXCHANGE=file_ingestor_exchange
    - FILE_INGESTOR_PARTITIONS=1
    - FILE_SPLITTER_QUEUE_PREFIX=file_splitter
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - GATEWAY_Q1_ENABLED=0
    - GATEWAY_Q5_QUEUE=join_q5_results_queue
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
  file_splitter_0:
    build:
      context: ./src/
      dockerfile: workers/file_splitter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_SPLITTER_INPUT_EXCHANGE=file_ingestor_exchange
    - FILE_SPLITTER_QUEUE_PREFIX=file_splitter
    - ID=0
    - LINE_BATCH_OUTPUT_QUEUE=line_batch_queue
    - LOGGING_LEVEL=INFO
    - MAX_BATCH_BYTES=1048576
    - MAX_LINE_BYTES=16777216
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - NODE_NAME=file_splitter_0
    container_name: file_splitter_0
  file_ingestor_0:
    build:
      context: ./src/
      dockerfile: workers/file_ingestor/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - FILE_INGESTOR_AMOUNT=1
    - FILE_INGESTOR_CONTROL_QUEUE_PREFIX=file_ingestor_control
    - FILE_INGESTOR_RESPONSE_QUEUE_PREFIX=file_ingestor_response
    - LINE_BATCH_INPUT_QUEUE=line_batch_queue
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - TRANSACTION_OUTPUT_EXCHANGE=transaction_fanout_exchange
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - NODE_NAME=file_ingestor_0
    volumes:
    - file_ingestor_0_state:/worker_state
    container_name: file_ingestor_0
  filter_q5_format_0:
    build:
      context: ./src/
      dockerfile: workers/filter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - CONFIGURATION=Q5
    - FILTER_AMOUNT=1
    - FILTER_DATE_QUEUE=filter_date_queue
    - FILTER_PREFIX=filter
    - FILTER_Q1_QUEUE=filter_q1_queue
    - FILTER_Q3_QUEUE=filter_q3_queue
    - FILTER_Q5_USD_QUEUE=filter_q5_usd_queue
    - GATEWAY_QUEUE=gateway_results_queue
    - ID=0
    - INPUT_QUEUE=filter_q5_format_queue
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - Q3_BARRIER_AMOUNT=1
    - Q3_CANDIDATES_QUEUE=q3_candidates_queue
    - SCATTER_GATHER_MAPPER_QUEUE=scatter_gather_mapper_queue
    - SUM_PREFIX=sum_q3
    - SUM_Q2_QUEUE=sum_q2_queue
    - SUM_Q3_QUEUE=sum_q3_queue
    - USD_ENABLE_Q1=0
    - USD_ENABLE_Q2=0
    - USD_ENABLE_DATE=0
    - DATE_ENABLE_Q3=0
    - DATE_ENABLE_Q4=0
    - TRANSACTION_EXCHANGE=transaction_fanout_exchange
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - NODE_NAME=filter_q5_format_0
    container_name: filter_q5_format_0
  rates_service:
    build:
      context: .
      dockerfile: src/rates_service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBIT_HOST=rabbitmq
    - RATES_REFERENCE_OVERLAY=q5
    - PYTHONUNBUFFERED=1
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    volumes:
    - ./data/rates:/data/rates:rw
  filter_q5_usd_0:
    build:
      context: ./src/
      dockerfile: workers/filter_q5_usd/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=2
    - AGGREGATION_PREFIX=aggregation_q5
    - FILTER_Q5_USD_AMOUNT=2
    - ID=0
    - INPUT_QUEUE=filter_q5_usd_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - RATES_REQUEST_QUEUE=rates_requests
    - Q5_START_DATE=2022-09-01
    - Q5_END_DATE=2022-09-05
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - NODE_NAME=filter_q5_usd_0
    container_name: filter_q5_usd_0
  filter_q5_usd_1:
    build:
      context: ./src/
      dockerfile: workers/filter_q5_usd/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=2
    - AGGREGATION_PREFIX=aggregation_q5
    - FILTER_Q5_USD_AMOUNT=2
    - ID=1
    - INPUT_QUEUE=filter_q5_usd_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - RATES_REQUEST_QUEUE=rates_requests
    - Q5_START_DATE=2022-09-01
    - Q5_END_DATE=2022-09-05
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - NODE_NAME=filter_q5_usd_1
    container_name: filter_q5_usd_1
  aggregation_q5_0:
    build:
      context: ./src/
      dockerfile: workers/aggregator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=2
    - AGGREGATION_PREFIX=aggregation_q5
    - CONFIGURATION=Q5
    - ID=0
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=join_q5_queue
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=2
    - SUM_PREFIX=filter_q5_usd
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - NODE_NAME=aggregation_q5_0
    volumes:
    - aggregation_q5_0_state:/worker_state
    container_name: aggregation_q5_0
  aggregation_q5_1:
    build:
      context: ./src/
      dockerfile: workers/aggregator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=2
    - AGGREGATION_PREFIX=aggregation_q5
    - CONFIGURATION=Q5
    - ID=1
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=join_q5_queue
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=2
    - SUM_PREFIX=filter_q5_usd
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - NODE_NAME=aggregation_q5_1
    volumes:
    - aggregation_q5_1_state:/worker_state
    container_name: aggregation_q5_1
  join_q5:
    build:
      context: ./src/
      dockerfile: workers/joiner/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=2
    - AGGREGATION_PREFIX=aggregation_q5
    - CONFIGURATION=Q5
    - ID=0
    - INPUT_QUEUE=join_q5_queue
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=join_q5_results_queue
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=2
    - SUM_PREFIX=filter_q5_usd
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - NODE_NAME=join_q5
    container_name: join_q5
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    depends_on:
    - gateway
    - file_splitter_0
    - file_ingestor_0
    - filter_q5_format_0
    - rates_service
    - filter_q5_usd_0
    - filter_q5_usd_1
    - aggregation_q5_0
    - aggregation_q5_1
    - join_q5
    environment:
    - ACCOUNTS_FILE=LI-Small_accounts.csv
    - TRANSACTIONS_FILE=LI-Small_Trans.csv
    - CHUNK_MAX_BYTES=1048576
    - CLIENT_ID=0
    - CONNECT_TIMEOUT_SECONDS=30
    - DATA_DIR=/data/input
    - OUTPUT_DIR=/data/output
    - IO_TIMEOUT_SECONDS=3600
    - LOGGING_LEVEL=INFO
    - PYTHONUNBUFFERED=1
    - RESULT_LINE_MAX_BYTES=1048576
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    volumes:
    - ./data/datasets/LI-Small:/data/input:ro
    - ./data/output:/data/output:rw
volumes:
  file_ingestor_0_state: null
  aggregation_q5_0_state: null
  aggregation_q5_1_state: null
