services:
  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 20s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_INGESTOR_EXCHANGE=file_ingestor_exchange
    - FILE_INGESTOR_PARTITIONS=1
    - FILE_SPLITTER_QUEUE_PREFIX=file_splitter
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - GATEWAY_Q2_QUEUE=join_q2_results_queue
    - GATEWAY_Q3_QUEUE=gateway_q3_results_queue
    - GATEWAY_Q4_QUEUE=gateway_q4_results_queue
    - GATEWAY_Q5_QUEUE=join_q5_results_queue
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100
    - FLOW_LOG_EVERY_BYTES=8388608
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100
    - CHUNK_LOG_EVERY=100
    - RESULT_LOG_EVERY=100
  file_splitter_0:
