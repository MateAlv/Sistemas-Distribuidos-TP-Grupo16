services:
  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 20s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_INGESTOR_EXCHANGE=file_ingestor_exchange
    - FILE_INGESTOR_PARTITIONS=3
    - FILE_SPLITTER_QUEUE_PREFIX=file_splitter
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - GATEWAY_Q2_QUEUE=join_q2_results_queue
    - GATEWAY_Q3_QUEUE=gateway_q3_results_queue
    - GATEWAY_Q4_QUEUE=gateway_q4_results_queue
    - GATEWAY_Q5_QUEUE=join_q5_results_queue
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
  file_splitter_0:
    build:
      context: ./src/
      dockerfile: workers/file_splitter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_SPLITTER_INPUT_EXCHANGE=file_ingestor_exchange
    - FILE_SPLITTER_QUEUE_PREFIX=file_splitter
    - FILE_INGESTOR_AMOUNT=6
    - ID=0
    - LINE_BATCH_OUTPUT_EXCHANGE=line_batch_exchange
    - LINE_BATCH_OUTPUT_ROUTING_PREFIX=file_ingestor
    - LOGGING_LEVEL=INFO
    - MAX_BATCH_BYTES=65536
    - MAX_LINE_BYTES=16777216
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - ACCOUNTS_LINE_BATCH_OUTPUT_QUEUE=accounts_line_batch_queue
    - FLOW_LOG_ENABLED=1
    - FLOW_LOG_EVERY_MESSAGES=100000
    - FLOW_LOG_EVERY_BYTES=2147483648
    - FLOW_LOG_FIRST_MESSAGES=1
    - WORKER_LOG_EVERY_MESSAGES=100000
    - CHUNK_LOG_EVERY=10000
    - RESULT_LOG_EVERY=100000
    - RABBITMQ_DURABLE=true
    - STATE_DIR=/worker_state
    - SNAPSHOT_INTERVAL=1000
    - NODE_NAME=file_splitter_0
    - MONITOR_HOSTS=monitor_1,monitor_2,monitor_3
    - MONITOR_PORT=9000
    volumes:
    - file_splitter_0_state:/worker_state
    container_name: file_splitter_0
