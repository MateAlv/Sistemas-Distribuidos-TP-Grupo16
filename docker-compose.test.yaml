    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=3
    - SUM_PREFIX=sum_q2

  aggregation_q2_0:
    build:
      context: ./src/
      dockerfile: workers/aggregator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation_q2
    - CONFIGURATION=Q2
    - ID=0
