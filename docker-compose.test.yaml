      dockerfile: workers/filter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - CONFIGURATION=DATE
    - FILTER_AMOUNT=1
    - FILTER_DATE_QUEUE=filter_date_queue
    - FILTER_PREFIX=filter
    - FILTER_Q1_QUEUE=filter_q1_queue
    - FILTER_Q3_QUEUE=filter_q3_queue
    - FILTER_Q5_USD_QUEUE=filter_q5_usd_queue
    - GATEWAY_QUEUE=gateway_results_queue
    - ID=0
    - INPUT_QUEUE=filter_date_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SCATTER_GATHER_MAPPER_QUEUE=scatter_gather_mapper_queue
    - SUM_PREFIX=sum_q3
    - SUM_Q2_QUEUE=sum_q2_queue
    - SUM_Q3_QUEUE=sum_q3_queue

  sum_q2_0:
    build:
      context: ./src/
      dockerfile: workers/sum/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation_q2
    - CONFIGURATION=Q2
    - ID=0
    - INPUT_QUEUE=sum_q2_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=3
    - SUM_PREFIX=sum_q2

  sum_q2_1:
    build:
      context: ./src/
      dockerfile: workers/sum/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation_q2
    - CONFIGURATION=Q2
    - ID=1
    - INPUT_QUEUE=sum_q2_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
