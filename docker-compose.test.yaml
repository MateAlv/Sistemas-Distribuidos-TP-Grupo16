  scatter_gather_detector_0:
    build:
      context: ./src/
      dockerfile: workers/scatter_gather/detector/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - GATEWAY_Q4_QUEUE=gateway_q4_results_queue
    - ID=0
    - MIN_INTERMEDIARIES=5
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SG_DETECTOR_EXCHANGE=sg_detector_exchange
    - SG_LINKER_AMOUNT=1

  scatter_gather_linker_0:
