  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    depends_on:
    - gateway
    - filter_date_0
    - filter_q1_0
    - filter_usd_0
    - sum_q2_0
    - sum_q2_1
    - sum_q2_2
    - sum_q3_0
