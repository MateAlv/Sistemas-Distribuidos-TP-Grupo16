    - SG_DETECTOR_AMOUNT=1
    - SG_DETECTOR_EXCHANGE=sg_detector_exchange
    - SG_LINKER_EXCHANGE=sg_linker_exchange

  scatter_gather_mapper_0:
    build:
      context: ./src/
      dockerfile: workers/scatter_gather/mapper/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - INPUT_QUEUE=scatter_gather_mapper_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SG_LINKER_AMOUNT=1
    - SG_LINKER_EXCHANGE=sg_linker_exchange
