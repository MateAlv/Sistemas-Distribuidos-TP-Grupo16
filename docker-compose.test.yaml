services:
  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 20s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_INGESTOR_EXCHANGE=file_ingestor_exchange
    - FILE_INGESTOR_PARTITIONS=1
    - GATEWAY_Q2_QUEUE=join_q2_results_queue
    - GATEWAY_Q4_QUEUE=gateway_q4_results_queue
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678

  file_ingestor_0:
    build:
      context: ./src/
      dockerfile: workers/file_ingestor/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - FILE_INGESTOR_EXCHANGE=file_ingestor_exchange
    - FILE_INGESTOR_QUEUE_PREFIX=file_ingestor
    - ID=0
    - LOGGING_LEVEL=INFO
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - TRANSACTION_OUTPUT_EXCHANGE=transaction_fanout_exchange

  filter_usd_0:
    build:
      context: ./src/
      dockerfile: workers/filter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - CONFIGURATION=USD
    - FILTER_AMOUNT=1
    - FILTER_DATE_QUEUE=filter_date_queue
    - FILTER_PREFIX=filter
    - FILTER_Q1_QUEUE=filter_q1_queue
    - FILTER_Q3_QUEUE=filter_q3_queue
    - FILTER_Q5_USD_QUEUE=filter_q5_usd_queue
    - GATEWAY_QUEUE=gateway_results_queue
    - ID=0
    - INPUT_QUEUE=filter_usd_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SCATTER_GATHER_MAPPER_QUEUE=scatter_gather_mapper_queue
    - SUM_PREFIX=sum_q3
    - SUM_Q2_QUEUE=sum_q2_queue
    - SUM_Q3_QUEUE=sum_q3_queue
    - TRANSACTION_EXCHANGE=transaction_fanout_exchange

  filter_q5_format_0:
    build:
      context: ./src/
      dockerfile: workers/filter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - CONFIGURATION=Q5
    - FILTER_AMOUNT=1
    - FILTER_DATE_QUEUE=filter_date_queue
    - FILTER_PREFIX=filter
    - FILTER_Q1_QUEUE=filter_q1_queue
    - FILTER_Q3_QUEUE=filter_q3_queue
    - FILTER_Q5_USD_QUEUE=filter_q5_usd_queue
    - GATEWAY_QUEUE=gateway_results_queue
    - ID=0
    - INPUT_QUEUE=filter_q5_format_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SCATTER_GATHER_MAPPER_QUEUE=scatter_gather_mapper_queue
    - SUM_PREFIX=sum_q3
    - SUM_Q2_QUEUE=sum_q2_queue
    - SUM_Q3_QUEUE=sum_q3_queue
    - TRANSACTION_EXCHANGE=transaction_fanout_exchange

  rates_service:
    build:
      context: .
      dockerfile: src/rates_service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - RABBIT_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    volumes:
    - ./data/rates:/data/rates:rw

  filter_q5_usd_0:
    build:
      context: ./src/
      dockerfile: workers/filter_q5_usd/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation_q5
    - ID=0
    - INPUT_QUEUE=filter_q5_usd_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - RATES_REQUEST_QUEUE=rates_requests
    - Q5_START_DATE=2022-09-01
    - Q5_END_DATE=2022-09-05

  filter_q1_0:
    build:
      context: ./src/
      dockerfile: workers/filter/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - CONFIGURATION=Q1
    - FILTER_AMOUNT=1
    - FILTER_DATE_QUEUE=filter_date_queue
    - FILTER_PREFIX=filter
    - FILTER_Q1_QUEUE=filter_q1_queue
    - FILTER_Q3_QUEUE=filter_q3_queue
    - FILTER_Q5_USD_QUEUE=filter_q5_usd_queue
    - GATEWAY_QUEUE=gateway_results_queue
    - ID=0
    - INPUT_QUEUE=filter_q1_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SCATTER_GATHER_MAPPER_QUEUE=scatter_gather_mapper_queue
    - SUM_PREFIX=sum_q3
    - SUM_Q2_QUEUE=sum_q2_queue
    - SUM_Q3_QUEUE=sum_q3_queue

  filter_date_0:
