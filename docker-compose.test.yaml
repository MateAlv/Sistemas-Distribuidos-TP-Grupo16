  sum_q3_0:
    build:
      context: ./src/
      dockerfile: workers/sum/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation
    - CONFIGURATION=Q3
    - ID=0
    - INPUT_QUEUE=sum_q3_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - SUM_AMOUNT=3
