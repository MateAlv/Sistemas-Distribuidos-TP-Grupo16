  join_q5:
    build:
      context: ./src/
      dockerfile: workers/joiner/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation_q5
    - CONFIGURATION=Q5
    - ID=0
    - INPUT_QUEUE=join_q5_queue
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=join_q5_results_queue
