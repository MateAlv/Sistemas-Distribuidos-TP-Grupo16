    - AGGREGATION_AMOUNT=1
    - AGGREGATION_PREFIX=aggregation
    - CONFIGURATION=Q3
    - ID=2
    - INPUT_QUEUE=sum_q3_queue
    - MOM_HOST=rabbitmq
